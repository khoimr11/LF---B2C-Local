<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>LF Sync</title>
<link rel="icon" href="assets/favicon.png">
<style>
:root{--bg:#f4f4f1;--card:#fff;--fg:#1d1d1f;--fg2:#66666b;--sep:rgba(60,60,67,.12);--brand:#4c6639;--ok:#248a3d;--bad:#d70015;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--fg:#f5f5f7;--fg2:#a1a1a6;--sep:rgba(84,84,88,.6);--brand:#8db36f;--ok:#30d158;--bad:#ff453a;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;padding:32px max(16px,env(safe-area-inset-right)) 32px max(16px,env(safe-area-inset-left))}
main{max-width:520px;margin:0 auto;display:grid;gap:14px}
h1{font-size:24px;margin:0;letter-spacing:-.02em}.sub{color:var(--fg2);margin:-6px 0 0}
.card{background:var(--card);border-radius:18px;padding:18px;display:grid;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.05)}
h2{font-size:15px;margin:0}label{display:grid;gap:4px;font-size:13px;color:var(--fg2)}
input{height:42px;border-radius:10px;border:1px solid var(--sep);background:transparent;color:var(--fg);padding:0 12px;font:inherit;width:100%}
button{height:42px;border:0;border-radius:10px;background:var(--brand);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--fg2);border:1px solid var(--sep)}
.st{display:flex;gap:8px;align-items:center;font-size:14px}.dot{width:9px;height:9px;border-radius:50%;background:var(--bad);flex:none}.dot.on{background:var(--ok)}
.note{font-size:12.5px;color:var(--fg2);margin:0}#log{font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;color:var(--fg2);margin:0;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
  <h1>Đồng bộ dữ liệu</h1>
  <p class="sub">Trang dùng cho lần cập nhật tự động hằng ngày của dashboard Living Furniture. Mã và khóa chỉ lưu trong trình duyệt này.</p>
  <section class="card">
    <div class="st"><span class="dot" id="dKey"></span><span id="sKey">Chưa có khóa dữ liệu</span></div>
    <div class="st"><span class="dot" id="dTok"></span><span id="sTok">Chưa có mã GitHub</span></div>
  </section>
  <form class="card" id="fKey">
    <h2>1. Khóa dữ liệu (đăng nhập dashboard)</h2>
    <label>Email<input id="email" type="email" autocomplete="username" required></label>
    <label>Mật khẩu<input id="pass" type="password" autocomplete="current-password" required></label>
    <button>Lưu khóa</button>
  </form>
  <form class="card" id="fTok">
    <h2>2. Mã truy cập GitHub</h2>
    <label>Fine-grained token (chỉ repo LF---B2C-Local, quyền Contents: Read and write)<input id="tok" type="password" autocomplete="off" required placeholder="github_pat_…"></label>
    <button>Kiểm tra và lưu mã</button>
  </form>
  <section class="card"><h2>Nhật ký</h2><pre id="log">—</pre><button class="ghost" id="forget" type="button">Xóa khóa và mã khỏi trình duyệt này</button></section>
</main>
<script>
(() => {
'use strict';
const REPO = 'khoimr11/LF---B2C-Local', PATH = 'data/data.enc.json', API = 'https://api.github.com/repos/' + REPO + '/contents/' + PATH;
const $ = s => document.querySelector(s);
const ls = { get: k => { try { return localStorage.getItem(k) || sessionStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }, del: k => { try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch (e) {} } };
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = u => { let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
const log = m => { const el = $('#log'); el.textContent = (el.textContent === '—' ? '' : el.textContent + '\n') + new Date().toLocaleTimeString('vi-VN') + '  ' + m; };
const tokH = () => ({ Authorization: 'Bearer ' + ls.get('lf-gh'), Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' });
function refresh() {
  const k = !!ls.get('lf-key'), t = !!ls.get('lf-gh');
  $('#dKey').classList.toggle('on', k); $('#sKey').textContent = k ? 'Đã có khóa dữ liệu' : 'Chưa có khóa dữ liệu';
  $('#dTok').classList.toggle('on', t); $('#sTok').textContent = t ? 'Đã có mã GitHub' : 'Chưa có mã GitHub';
}
async function getFile() {
  const r = await fetch(API + '?ref=main&t=' + Date.now(), { headers: tokH(), cache: 'no-store' });
  if (!r.ok) throw new Error('GitHub đọc file lỗi ' + r.status);
  const j = await r.json(); return { sha: j.sha, file: JSON.parse(new TextDecoder().decode(b64d(j.content.replace(/\n/g, '')))) };
}
const aes = raw => crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']);
async function decrypt(file, raw) { return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(file.iv) }, await aes(raw), b64d(file.ct)))); }
async function encrypt(obj, raw, file) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await aes(raw), new TextEncoder().encode(JSON.stringify(obj))));
  return { v: 1, kdf: file.kdf, iter: file.iter, salt: file.salt, iv: b64e(iv), ct: b64e(ct), updated: new Date().toISOString() };
}
// same rules as scripts/data-tool.mjs merge
function merge(data, add) {
  const bySn = new Map(data.orders.map(r => [r[0], r])); let added = 0, updated = 0;
  for (const r of add.orders || []) { const old = bySn.get(r[0]); if (!old) { bySn.set(r[0], r); added++; continue; }
    const m = r.slice(); for (let i = 11; i <= 31; i++) if (m[i] === null || m[i] === undefined) m[i] = old[i] ?? null; bySn.set(r[0], m); updated++; }
  data.orders = [...bySn.values()].sort((a, b) => b[1] - a[1]);
  const byDay = new Map((data.ads || []).map(r => [r[0], r])); for (const r of add.ads || []) byDay.set(r[0], r); data.ads = [...byDay.values()].sort((a, b) => a[0] - b[0]);
  if (add.products && add.products.length) data.products = add.products;
  if (add.reviews && add.reviews.length) { const rk = r => r[4] + '|' + r[0], m = new Map((data.reviews || []).map(r => [rk(r), r])); for (const r of add.reviews) m.set(rk(r), r); data.reviews = [...m.values()].sort((a, b) => b[0] - a[0]); }
  if (add.promo) { const P = data.promo || (data.promo = { fs: [], disc: [], vch: [], kpi: [] });
    for (const k of ['fs', 'disc', 'vch']) { const m = new Map((P[k] || []).map(r => [r[0], r])); (add.promo[k] || []).forEach(r => m.set(r[0], r)); P[k] = [...m.values()].sort((a, b) => b[k === 'fs' ? 1 : 3] - a[k === 'fs' ? 1 : 3]); }
    const km = new Map((P.kpi || []).map(r => [r[0] + '|' + r[2], r])); (add.promo.kpi || []).forEach(r => km.set(r[0] + '|' + r[2], r)); P.kpi = [...km.values()].sort((a, b) => a[2] - b[2]); }
  if (add.ledger && add.ledger.length) { const from = Math.min(...add.ledger.map(r => r[0])); data.ledger = (data.ledger || []).filter(r => r[0] < from).concat(add.ledger).sort((a, b) => a[0] - b[0]); }
  data.meta = { ...(data.meta || {}), at: Math.floor(Date.now() / 1000) };
  return { added, updated };
}
let buf = [];
window.LFSYNC = {
  ready() { return JSON.stringify({ key: !!ls.get('lf-key'), token: !!ls.get('lf-gh') }); },
  reset() { buf = []; return 'ok'; },
  add(s) { buf.push(String(s)); return buf.length + ' parts, ' + buf.join('').length + ' chars'; },
  async publish() {
    if (!ls.get('lf-key') || !ls.get('lf-gh')) throw new Error('Thiếu khóa dữ liệu hoặc mã GitHub: mở trang sync.html để thiết lập');
    let add; try { add = JSON.parse(buf.join('')); } catch (e) { throw new Error('Gói dữ liệu ghép lại không phải JSON hợp lệ: ' + e.message); }
    const raw = b64d(ls.get('lf-key')), { sha, file } = await getFile(), data = await decrypt(file, raw), res = merge(data, add);
    const enc = await encrypt(data, raw, file), d = new Date(Date.now() + 7 * 3600e3);
    const msg = 'data: Shopee sync ' + d.toISOString().slice(0, 16).replace('T', ' ') + ' GMT+7';
    const r = await fetch(API, { method: 'PUT', headers: { ...tokH(), 'Content-Type': 'application/json' }, body: JSON.stringify({ message: msg, content: b64e(new TextEncoder().encode(JSON.stringify(enc))), sha, branch: 'main' }) });
    if (!r.ok) throw new Error('GitHub ghi file lỗi ' + r.status + ' ' + (await r.text()).slice(0, 160));
    const commit = (await r.json()).commit.sha.slice(0, 7);
    const ok = data.orders.filter(o => !/hủy/i.test(o[3])), y = Math.floor((Date.now() / 1000 + 7 * 3600) / 86400) - 1;
    const yNmv = ok.filter(o => Math.floor((o[1] + 7 * 3600) / 86400) === y).reduce((s, o) => s + o[5], 0);
    buf = []; const out = { commit, ...res, orders: data.orders.length, valid: ok.length, nmvYesterday: yNmv };
    log('Đã đồng bộ ' + JSON.stringify(out)); return JSON.stringify(out);
  }
};
$('#fKey').addEventListener('submit', async e => {
  e.preventDefault();
  try {
    const f = await (await fetch('data/data.enc.json?t=' + Date.now(), { cache: 'no-store' })).json();
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode($('#email').value.trim().toLowerCase() + '\n' + $('#pass').value), 'PBKDF2', false, ['deriveBits']);
    const raw = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64d(f.salt), iterations: f.iter || 250000 }, base, 256));
    await decrypt(f, raw); ls.set('lf-key', b64e(raw)); $('#pass').value = ''; log('Đã lưu khóa dữ liệu');
  } catch (x) { log('Email hoặc mật khẩu không đúng'); }
  refresh();
});
$('#fTok').addEventListener('submit', async e => {
  e.preventDefault(); const t = $('#tok').value.trim(); if (!/^(github_pat_|ghp_)/.test(t)) { log('Mã phải bắt đầu bằng github_pat_ — kiểm tra lại đã copy đúng chưa'); return; }
  try {
    const r = await fetch('https://api.github.com/repos/' + REPO, { headers: { Authorization: 'Bearer ' + t, Accept: 'application/vnd.github+json' } });
    const j = await r.json(); if (!r.ok) throw new Error(r.status);
    ls.set('lf-gh', t); $('#tok').value = ''; log('Mã GitHub hợp lệ, đã lưu');
  } catch (x) { log('Mã GitHub không dùng được cho repo ' + REPO + ' (' + x.message + ')'); }
  refresh();
});
$('#forget').addEventListener('click', () => { ls.del('lf-key'); ls.del('lf-gh'); log('Đã xóa khóa và mã'); refresh(); });
refresh();
})();
</script>
</body>
</html>
